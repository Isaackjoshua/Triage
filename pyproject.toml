[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "A transport-agnostic AI machine-diagnostics agent with a hard read/write safety split"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40",
    "asyncssh>=2.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
triage = "triage.cli.main:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.setuptools.package-data]
"triage.agent" = ["catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
